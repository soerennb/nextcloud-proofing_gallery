name: ${COMPOSE_PROJECT_NAME}

x-nextcloud: &nextcloud
  image: nextcloud:${NEXTCLOUD_VERSION:-34}-apache
  environment: &nextcloud-environment
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: compatibility-test
    NEXTCLOUD_TRUSTED_DOMAINS: localhost
  volumes:
    - ${APP_SOURCE:?Set APP_SOURCE}:/opt/proofing_gallery:ro
  healthcheck:
    test: ["CMD-SHELL", "if test -f /tmp/proofing-gallery-upgrade-healthcheck-ready; then exit 0; fi; su -s /bin/sh www-data -c \"php occ status --output=json\" | grep -q '\"installed\":true'"]
    interval: 5s
    timeout: 10s
    retries: 48
    start_period: 15s

services:
  sqlite:
    <<: *nextcloud
    profiles: [sqlite]
    environment:
      <<: *nextcloud-environment
      SQLITE_DATABASE: nextcloud

  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: compatibility-test
      MARIADB_ROOT_PASSWORD: compatibility-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  nextcloud-mariadb:
    <<: *nextcloud
    profiles: [mariadb]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      <<: *nextcloud-environment
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: compatibility-test
      MYSQL_HOST: mariadb

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: compatibility-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 3s
      timeout: 5s
      retries: 40

  nextcloud-postgres:
    <<: *nextcloud
    profiles: [postgres]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *nextcloud-environment
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: compatibility-test
      POSTGRES_HOST: postgres
