version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      npm-development:
        dependency-type: development
      nextcloud-frontend:
        patterns: ["@nextcloud/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    groups:
      composer-development:
        dependency-type: development
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
