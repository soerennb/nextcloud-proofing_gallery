name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  queue-eligible-update:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Do not check out the pull request: pull_request_target has write access.
      - name: Fetch verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check auto-merge policy
        id: policy
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          DEPENDABOT_BRANCH: ${{ github.event.pull_request.head.ref }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail

          eligible=false
          reason="update type is not patch or minor"
          case "${UPDATE_TYPE}" in
            version-update:semver-patch|version-update:semver-minor)
              case "${DEPENDABOT_BRANCH}" in
                dependabot/npm_and_yarn/npm-development-*|dependabot/composer/composer-development-*|dependabot/github_actions/github-actions-*)
                  eligible=true
                  reason="approved Dependabot branch group"
                  ;;
                *)
                  if [ "${PACKAGE_ECOSYSTEM}" = "npm" ] && [ "${DEPENDENCY_NAMES}" = "vue" ]; then
                    eligible=true
                    reason="explicit Vue exception"
                  else
                    reason="dependency group is outside the auto-merge policy"
                  fi
                  ;;
              esac
              ;;
          esac

          {
            echo "eligible=${eligible}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Dependabot auto-merge policy"
            echo
            echo "- Ecosystem: \`${PACKAGE_ECOSYSTEM}\`"
            echo "- Group: \`${DEPENDENCY_GROUP:-none}\`"
            echo "- Branch: \`${DEPENDABOT_BRANCH}\`"
            echo "- Update type: \`${UPDATE_TYPE}\`"
            echo "- Dependencies: \`${DEPENDENCY_NAMES}\`"
            echo "- Decision: \`${eligible}\` (${reason})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Queue squash auto-merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PR_URL}"
