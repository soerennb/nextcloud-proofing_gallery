name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 1 * * 4"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      php: ${{ steps.classify.outputs.php }}
      workflow: ${{ steps.classify.outputs.workflow }}
      docs: ${{ steps.classify.outputs.docs }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      integration: ${{ steps.classify.outputs.integration }}
      compatibility: ${{ steps.classify.outputs.compatibility }}
      upgrade: ${{ steps.classify.outputs.upgrade }}
      codeql: ${{ steps.classify.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            git ls-files | node scripts/classify-ci-changes.mjs --
          else
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | node scripts/classify-ci-changes.mjs --
          fi

  workflow:
    needs: classify
    if: needs.classify.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Parse every workflow as YAML
        run: node scripts/check-workflows.mjs

  docs:
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run build:docs

  web:
    needs: classify
    if: needs.classify.outputs.web == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:docs
      - if: needs.classify.outputs.dependencies == 'true'
        run: npm audit --audit-level=high
      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: |
            css
            js
          if-no-files-found: error
          retention-days: 1

  main_web_smoke:
    name: main web smoke
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: needs.classify.outputs.dependencies == 'true'
        run: npm audit --audit-level=high
      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: |
            css
            js
          if-no-files-found: error
          retention-days: 1

  php:
    needs: classify
    if: needs.classify.outputs.php == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        php: ["8.1", "8.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer analyse
      - if: needs.classify.outputs.dependencies == 'true'
        run: composer audit --locked --no-interaction

  main_php_smoke:
    name: main PHP smoke
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-main-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-main-
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer analyse
      - if: needs.classify.outputs.dependencies == 'true'
        run: composer audit --locked --no-interaction

  dependency-review:
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan only commits introduced by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" /repo

  secret-history:
    needs: classify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete public history
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo

  codeql:
    needs: classify
    if: needs.classify.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  e2e:
    needs: [classify, web, php, main_web_smoke, main_php_smoke]
    if: >-
      always() && github.event_name != 'push' &&
      needs.classify.outputs.integration == 'true' &&
      needs.web.result == 'success' && needs.php.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium and runner dependencies
        run: |
          if ! timeout --kill-after=30s 5m npx playwright install --with-deps chromium; then
            echo "::warning::System dependency installation stalled; using runner-provided browser libraries."
            npx playwright install chromium
          fi
      - run: make dev-up
      - run: make occ CMD="app:list --enabled --output=json" | grep -q '"proofing_gallery"'
      - run: npm run test:e2e
      - name: Verify Context Agent and user-migration contracts
        run: |
          ./scripts/test-context-agent.sh
          ./scripts/test-user-migration.sh
      - name: Verify protected public routes
        env:
          E2E_SECURITY_PROTECTIONS: "1"
        run: npm run test:e2e -- --grep "public routes reject|Live Push credentials"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        run: docker compose down --volumes --remove-orphans

  compatibility:
    needs: [classify, web, php, main_web_smoke, main_php_smoke]
    if: >-
      always() && needs.classify.outputs.compatibility == 'true' &&
      ((github.event_name == 'push' && needs.main_web_smoke.result == 'success' && needs.main_php_smoke.result == 'success') ||
      (github.event_name != 'push' && needs.web.result == 'success' && needs.php.result == 'success'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        nextcloud: ["31", "32", "33", "34"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-build-${{ github.run_id }}
          path: .
      - env:
          NEXTCLOUD_VERSIONS: ${{ matrix.nextcloud }}
          DATABASES: sqlite
        run: ./scripts/compatibility-matrix.sh

  package:
    name: build upgrade package
    needs: [classify, web, php, main_web_smoke, main_php_smoke]
    outputs:
      use_release_baseline: ${{ steps.release_baseline.outputs.use }}
    if: >-
      always() && needs.classify.outputs.upgrade == 'true' &&
      ((github.event_name == 'push' && needs.main_web_smoke.result == 'success' && needs.main_php_smoke.result == 'success') ||
      (github.event_name != 'push' && needs.web.result == 'success' && needs.php.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: none
      - run: npm ci
      - id: release_baseline
        run: |
          version="$(php -r '$xml=simplexml_load_file("appinfo/info.xml"); echo (string)$xml->version;')"
          if test "${version}" != "0.7.0"; then echo "use=true" >> "${GITHUB_OUTPUT}"; else echo "use=false" >> "${GITHUB_OUTPUT}"; fi
      - run: make appstore
      - name: Validate package archive
        run: ./scripts/validate-appstore-package.sh build/artifacts/appstore/proofing_gallery.tar.gz
      - name: Verify package installation
        env:
          APPSTORE_ARCHIVE: ${{ github.workspace }}/build/artifacts/appstore/proofing_gallery.tar.gz
        run: ./scripts/verify-appstore-package.sh
      - name: Upload upgrade package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-upgrade-package-${{ github.run_id }}
          path: build/artifacts/appstore/proofing_gallery.tar.gz
          if-no-files-found: error
          retention-days: 1

  upgrade:
    needs: [classify, package]
    if: always() && needs.classify.outputs.upgrade == 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        database: [sqlite, mariadb, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download upgrade package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-upgrade-package-${{ github.run_id }}
          path: build/artifacts/appstore
      - run: make test-upgrade
        env:
          UPGRADE_DATABASE: ${{ matrix.database }}
          UPGRADE_CURRENT_ARCHIVE: ${{ github.workspace }}/build/artifacts/appstore/proofing_gallery.tar.gz
          UPGRADE_FROM_ARCHIVE_URL: ${{ needs.package.outputs.use_release_baseline == 'true' && 'https://github.com/soerennb/nextcloud-proofing_gallery/releases/download/v0.7.0/proofing_gallery.tar.gz' || '' }}
          UPGRADE_FROM_CHECKSUMS_URL: ${{ needs.package.outputs.use_release_baseline == 'true' && 'https://github.com/soerennb/nextcloud-proofing_gallery/releases/download/v0.7.0/SHA256SUMS' || '' }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [classify, workflow, docs, web, main_web_smoke, php, main_php_smoke, dependency-review, secret-scan, secret-history, codeql, e2e, compatibility, package, upgrade]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "A selected CI job did not succeed: ${result}" >&2; exit 1 ;;
            esac
          done
          echo "All selected CI checks passed."
