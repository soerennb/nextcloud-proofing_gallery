name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ["31", "32", "33", "34"]
        database: [sqlite, mariadb, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Enable and migrate the app
        env:
          NEXTCLOUD_VERSIONS: ${{ matrix.nextcloud }}
          DATABASES: ${{ matrix.database }}
        run: ./scripts/compatibility-matrix.sh
