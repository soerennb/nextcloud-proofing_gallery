name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer analyse
      - run: composer audit --no-interaction

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make dev-up
      - run: npm run test:e2e
      - name: Verify protected public routes
        env:
          E2E_SECURITY_PROTECTIONS: "1"
        run: npm run test:e2e -- --grep "public routes reject|Live Push credentials"
      - if: always()
        run: docker compose down --volumes --remove-orphans

  package-and-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: make appstore
      - run: make verify-package
      - run: make test-upgrade

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ["31", "32", "33", "34"]
        database: [sqlite, mariadb, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Enable and migrate the app
        env:
          NEXTCLOUD_VERSIONS: ${{ matrix.nextcloud }}
          DATABASES: ${{ matrix.database }}
        run: ./scripts/compatibility-matrix.sh
