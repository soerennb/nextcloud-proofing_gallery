name: Set up PHP project
description: Install the repository PHP toolchain and locked dependencies
inputs:
  php-version:
    description: PHP version to use
    required: true
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-composer-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ inputs.php-version }}-
    - name: Install locked Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist
