name: Set up Node project
description: Install the repository Node toolchain and locked dependencies
inputs:
  node-version-file:
    description: File containing the required Node version
    required: false
    default: .nvmrc
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
    - name: Install locked npm dependencies
      shell: bash
      run: npm ci
