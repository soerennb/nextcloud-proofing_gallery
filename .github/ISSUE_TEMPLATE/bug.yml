name: Bug report
description: Report a reproducible defect that does not contain sensitive information
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not report security problems here. Use the private security-reporting form instead.
  - type: input
    id: app-version
    attributes:
      label: Proofing Gallery version
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud and PHP versions
      placeholder: Nextcloud 34.0.0, PHP 8.4
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, MariaDB/MySQL, PostgreSQL, Unknown]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data and remove links, tokens, paths, and personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: This report contains no credentials, private gallery URLs, personal data, or customer media.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
