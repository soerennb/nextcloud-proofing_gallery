name: ${COMPOSE_PROJECT_NAME:-proofing-gallery}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MARIADB_USER: ${MYSQL_USER:-nextcloud}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-nextcloud}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nextcloud-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.26
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"

  nextcloud:
    image: nextcloud:34-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &nextcloud-environment
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nextcloud}
      MYSQL_HOST: db
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: proofing-gallery
      MAIL_DOMAIN: localhost
    ports:
      - "127.0.0.1:${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - nextcloud-data:/var/www/html
      - ./:/var/www/html/custom_apps/proofing_gallery

  cron:
    image: nextcloud:34-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - nextcloud
    environment: *nextcloud-environment
    volumes:
      - nextcloud-data:/var/www/html
      - ./:/var/www/html/custom_apps/proofing_gallery

volumes:
  db-data:
  nextcloud-data:
